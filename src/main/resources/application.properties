# =============================================================================
# Datasource
# =============================================================================
quarkus.datasource.db-kind=mssql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=feedback;encrypt=false}
quarkus.datasource.username=${DB_USERNAME:sa}
quarkus.datasource.password=${DB_PASSWORD:Password123!}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10

# =============================================================================
# Hibernate ORM
# =============================================================================
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# =============================================================================
# Liquibase
# =============================================================================
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml
quarkus.liquibase.clean-at-start=false

# =============================================================================
# Azure Key Vault
# =============================================================================
azure.keyvault.url=https://kvTechCharger4Feedback26.vault.azure.net/

# =============================================================================
# Azure Storage Queue
# =============================================================================
azure.storage.queue.name=feedback-urgente
azure.storage.account.name=sttechchargerfeedback

# =============================================================================
# Azure Functions
# =============================================================================
quarkus.azure-functions.app-name=tech-charger4-feedback
quarkus.azure-functions.region=westus2

# =============================================================================
# Logging
# =============================================================================
quarkus.log.level=INFO
quarkus.log.category."br.com.fiap".level=DEBUG

# =============================================================================
# Application
# =============================================================================
quarkus.application.name=feedback-functions
quarkus.application.version=1.0-SNAPSHOT

